plugins {
    id 'com.android.application'
}

android {
    namespace 'org.grafalinux.monitor'
    compileSdk 34

    defaultConfig {
        applicationId 'org.grafalinux.monitor'
        minSdk 21
        targetSdk 34
        versionCode 4
        versionName '0.3.1-beta'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
